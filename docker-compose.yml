services:
  postgres-db:
    image: postgres:15
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=secretpassword
      - POSTGRES_DB=bookstore_db
    ports:
      - "5432:5432"
    networks:
      - bookstore-networks
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  book-service:
    build: ./book-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/bookstore_db
    ports:
      - "8081:8081"
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: on-failure
    networks:
      - bookstore-networks

  inventory-service:
    build: ./inventory-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/bookstore_db
    ports:
      - "8082:8082"
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: on-failure
    networks:
      - bookstore-networks

  gateway-service:
    build: ./gateway-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/bookstore_db
    ports:
      - "8080:8080"
    depends_on:
      - book-service
      - inventory-service
    networks:
      - bookstore-networks

networks:
  bookstore-networks:
    driver: bridge