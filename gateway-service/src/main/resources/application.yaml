spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webmvc:
          routes:
          - id: book-service
            uri: http://book-service:8081
            predicates:
              - Path=/api/books/**
          - id: inventory-service
            uri: http://inventory-service:8082
            predicates:
              - Path=/api/inventory/**
server:
  port: 8080
