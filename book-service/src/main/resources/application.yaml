spring:
  application:
    name: book-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bookstore_db}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:secretpassword}
  jpa:
    hibernate:
      ddl-auto: update
server:
  port: 8081
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
inventory:
  url: ${INVENTORY_URL:http://inventory-service:8082}
